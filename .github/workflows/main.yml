
name: CompanyScope AI - Live Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download project files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest requests

      - name: Test Python modules
        run: |
          python -m compileall -q app.py engine.py intelligence.py live_pipeline.py monitoring.py official_ir.py

      - name: Test internet connectivity
        run: |
          python - <<'PY'
          import requests

          urls = {
              "Apple Investor Relations": "https://investor.apple.com/",
              "Siemens Investor Relations": "https://www.siemens.com/investor/",
              "LVMH Investors": "https://www.lvmh.com/investors/",
              "Unilever Investors": "https://www.unilever.com/investors/",
              "Tata Motors": "https://www.tatamotors.com/",
              "SEC Company Facts": "https://data.sec.gov/api/xbrl/companyfacts/CIK0000320193.json"
          }

          for name, url in urls.items():
              try:
                  response = requests.get(
                      url,
                      timeout=20,
                      headers={
                          "User-Agent": "CompanyScopeAI Research contact research@example.org"
                      }
                  )
                  print(f"{name}: HTTP {response.status_code}, bytes={len(response.content)}")
              except requests.RequestException as error:
              
      - name: Analyze Apple financial data
        run: |
          python - <<'PY'
          import requests
          from datetime import datetime, timezone

          url = "https://data.sec.gov/api/xbrl/companyfacts/CIK0000320193.json"
          headers = {
              "User-Agent": "CompanyScopeAI contact your-real-email@example.com",
              "Accept-Encoding": "gzip, deflate"
          }

          response = requests.get(url, headers=headers, timeout=30)
          response.raise_for_status()
          data = response.json()

          print("COMPANY:", data.get("entityName"))
          print("CHECKED:", datetime.now(timezone.utc).isoformat())

          facts = data["facts"]["us-gaap"]

          metrics = {
              "Revenue": [
                  "RevenueFromContractWithCustomerExcludingAssessedTax",
                  "Revenues"
              ],
              "Net income": ["NetIncomeLoss"],
              "Operating income": ["OperatingIncomeLoss"],
              "Operating cash flow": [
                  "NetCashProvidedByUsedInOperatingActivities"
              ],
              "Cash and equivalents": [
                  "CashAndCashEquivalentsAtCarryingValue"
              ],
              "Long-term debt": ["LongTermDebtNoncurrent"]
          }

          for label, tags in metrics.items():
              fact = next((facts[t] for t in tags if t in facts), None)

              if not fact:
                  print(f"{label}: NOT AVAILABLE")
                  continue

              entries = [
                  x for x in fact["units"].get("USD", [])
                  if x.get("form") in ("10-K", "10-Q")
                  and x.get("filed")
              ]

              if not entries:
                  print(f"{label}: NO MATCHING FILINGS")
                  continue

              latest = max(
                  entries,
                  key=lambda x: (
                      x["filed"],
                      x.get("end", ""),
                      x.get("start", "")
                  )
              )

              print(
                  f"{label}: USD {latest['val']:,} "
                  f"| period={latest.get('start', 'instant')} "
                  f"to {latest.get('end')} "
                  f"| filed={latest['filed']} "
                  f"| form={latest['form']} "
                  f"| accession={latest.get('accn')}"
              )
              PY

                  print(f"{name}: ERROR {error}")
          PY
